services:
  db:
    image: postgres:16-alpine
    container_name: finance_tracker_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: expense_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: finance_tracker_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/expense_tracker?schema=public"
      JWT_SECRET: "super-secret-jwt-key-personal-finance-tracker-2026"
      NODE_ENV: "development"
      # Bật polling để đảm bảo Hot-Reloading hoạt động ổn định giữa Windows Host và Linux Container
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma generate &&
             npx prisma db push &&
             npm run db:seed &&
             npm run dev"

volumes:
  postgres_data:
